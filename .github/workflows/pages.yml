name: Build, check and publish academic website

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'static/**'
      - 'build.py'
      - 'scripts/**'
      - 'tests/**'
      - 'counter/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'content/**'
      - 'static/**'
      - 'build.py'
      - 'scripts/**'
      - 'tests/**'
      - 'counter/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build all pages
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 build.py
      - name: Check links, images and content
        run: python3 scripts/validate.py --report test-report.json
      - name: Test content-only updates and validation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test persistent counter adapter
        run: node --test tests/counter.test.mjs tests/visits.test.mjs
      - name: Upload verified website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified website
        id: deployment
        uses: actions/deploy-pages@v4
